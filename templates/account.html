<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e6f7ff 0%, #f0f8ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .account-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 75px rgba(0,0,0,0.1);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #0056cc;
            transform: translateY(-3px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #007AFF, #00b4ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        .user-info h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .user-info p {
            font-size: 20px;
            color: #666;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #eee;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #007AFF;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.1);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #007AFF;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 18px;
            color: #666;
        }

        .section-title {
            font-size: 28px;
            color: #333;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #007AFF;
        }

        .settings-list {
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .setting-item {
            padding: 25px;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-item:hover {
            background: white;
            padding-left: 35px;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .setting-icon {
            width: 40px;
            height: 40px;
            background: #007AFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .setting-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .setting-desc {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logout-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        }
    </style>
</head>
<body>
    <div class="account-container">
        <button class="back-btn" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i> Назад
        </button>

        <div class="profile-header">
            <div class="avatar-large">
                <i class="bi bi-person"></i>
            </div>
            <div class="user-info">
                <h1>Иван Петров</h1>
                <p><i class="bi bi-envelope"></i> ivan.petrov@example.com</p>
                <p><i class="bi bi-phone"></i> +7 (999) 123-45-67</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">12</div>
                <div class="stat-label">Заданий выполнено</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">85%</div>
                <div class="stat-label">Успеваемость</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">3 д.</div>
                <div class="stat-label">Время обучения</div>
            </div>
        </div>

        <h2 class="section-title"><i class="bi bi-gear"></i> Настройки</h2>

        <div class="settings-list">
            <div class="setting-item" onclick="showNotification('Режим настроек')">
                <div class="setting-left">
                    <div class="setting-icon">
                        <i class="bi bi-moon"></i>
                    </div>
                    <div>
                        <div class="setting-title">Темная тема</div>
                        <div class="setting-desc">Включить темный режим</div>
                    </div>
                </div>
                <i class="bi bi-toggle-off" style="font-size: 24px; color: #666;"></i>
            </div>

            <div class="setting-item" onclick="showNotification('Настройки уведомлений')">
                <div class="setting-left">
                    <div class="setting-icon">
                        <i class="bi bi-bell"></i>
                    </div>
                    <div>
                        <div class="setting-title">Уведомления</div>
                        <div class="setting-desc">Настройка оповещений</div>
                    </div>
                </div>
                <i class="bi bi-chevron-right" style="font-size: 24px; color: #666;"></i>
            </div>

            <div class="setting-item" onclick="showNotification('Языковые настройки')">
                <div class="setting-left">
                    <div class="setting-icon">
                        <i class="bi bi-translate"></i>
                    </div>
                    <div>
                        <div class="setting-title">Язык</div>
                        <div class="setting-desc">Русский</div>
                    </div>
                </div>
                <i class="bi bi-chevron-right" style="font-size: 24px; color: #666;"></i>
            </div>

            <div class="setting-item" onclick="showNotification('Настройки безопасности')">
                <div class="setting-left">
                    <div class="setting-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <div>
                        <div class="setting-title">Безопасность</div>
                        <div class="setting-desc">Смена пароля и 2FA</div>
                    </div>
                </div>
                <i class="bi bi-chevron-right" style="font-size: 24px; color: #666;"></i>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Выйти из аккаунта
        </button>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        function showNotification(message) {
            // Создаем уведомление, если его нет
            if (!document.querySelector('.notification')) {
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.style.cssText = `
                    position: fixed;
                    top: 30px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(0,0,0,0.9);
                    color: white;
                    padding: 20px 40px;
                    border-radius: 30px;
                    z-index: 1000;
                    font-size: 18px;
                    font-weight: 600;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                `;
                document.body.appendChild(notification);
            }

            const notification = document.querySelector('.notification');
            notification.textContent = message;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти из аккаунта?')) {
                showNotification('Выход из аккаунта...');
                setTimeout(() => {
                    window.location.href = 'index.html'; // или другая стартовая страница
                }, 1500);
            }
        }
    </script>
</body>
</html>
